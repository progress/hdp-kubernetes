{{- if .Values.hdp.database.postgres.enabled }}
# Creates the initial script to set up the PostgreSQL Database for HDP as an external Account Database.
# DB user credentials (HDP_ADMIN_PG_USERNAME/USERPWD and HDP_USER_PG_USERNAME/USERPWD) are resolved
# at runtime from hdp-secrets via environment variables injected into the postgres-db-init init
# container — no render-time lookup is performed here. This prevents credential duplication into
# chart-rendered manifests and the Helm release Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  labels: {{- include "hdp.labels.merge" (dict "commonLabels" .Values.hdp.commonLabels "specificLabels" .Values.hdp.configLabels "context" .) | nindent 4 }}
  annotations: {{- include "hdp.annotations.merge" (dict "commonAnnotations" .Values.hdp.commonAnnotations "specificAnnotations" .Values.hdp.configAnnotations "context" .) | nindent 4 }}
  name: {{ include "hybriddatapipeline.fullname" . }}-postgres-init
data:
  init.sh: |-
    set -e
    echo "Using PostgreSQL connection: $PGHOST:$PGPORT"
    echo "PGPASSWORD is set: $([ -n "$PGPASSWORD" ] && echo "yes" || echo "no")"
    
    # Normalize database credentials: strip CR/LF that may be present from secret encoding
    # Handles cases where base64 encoding included trailing newlines (e.g., using 'echo' instead of 'echo -n')
    # Use printf instead of echo to safely handle values that start with - or contain backslashes
    HDP_ADMIN_PG_USERNAME=$(printf '%s' "$HDP_ADMIN_PG_USERNAME" | tr -d '\r\n')
    HDP_ADMIN_PG_USERPWD=$(printf '%s' "$HDP_ADMIN_PG_USERPWD" | tr -d '\r\n')
    HDP_USER_PG_USERNAME=$(printf '%s' "$HDP_USER_PG_USERNAME" | tr -d '\r\n')
    HDP_USER_PG_USERPWD=$(printf '%s' "$HDP_USER_PG_USERPWD" | tr -d '\r\n')
    
    # Validate that all required database credentials are present (fail fast with clear error)
    [ -z "$HDP_ADMIN_PG_USERNAME" ] && { echo "ERROR: HDP_ADMIN_PG_USERNAME is empty or missing from hdp-secrets" >&2; exit 1; }
    [ -z "$HDP_ADMIN_PG_USERPWD" ] && { echo "ERROR: HDP_ADMIN_PG_USERPWD is empty or missing from hdp-secrets" >&2; exit 1; }
    [ -z "$HDP_USER_PG_USERNAME" ] && { echo "ERROR: HDP_USER_PG_USERNAME is empty or missing from hdp-secrets" >&2; exit 1; }
    [ -z "$HDP_USER_PG_USERPWD" ] && { echo "ERROR: HDP_USER_PG_USERPWD is empty or missing from hdp-secrets" >&2; exit 1; }
    
    # Database configuration
    HDP_PG_DB_NAME={{.Values.hdp.database.postgres.databaseName}}
    HDP_PG_DB_SCHEMA_NAME={{.Values.hdp.database.postgres.schemaName}}

    psql -v ON_ERROR_STOP=1 --host $PGHOST --port $PGPORT --username $PGUSER --dbname $PGDATABASE <<-EOSQL
      create database $HDP_PG_DB_NAME;
      create user $HDP_ADMIN_PG_USERNAME with PASSWORD '$HDP_ADMIN_PG_USERPWD';
      create user $HDP_USER_PG_USERNAME with PASSWORD '$HDP_USER_PG_USERPWD';
    EOSQL
    psql -v ON_ERROR_STOP=1 --host $PGHOST --port $PGPORT --username $PGUSER --dbname $HDP_PG_DB_NAME <<-EOSQL
      create schema $HDP_PG_DB_SCHEMA_NAME authorization $HDP_ADMIN_PG_USERNAME;
      create extension citext with schema $HDP_PG_DB_SCHEMA_NAME;
      grant usage on schema $HDP_PG_DB_SCHEMA_NAME to $HDP_USER_PG_USERNAME;
      alter user $HDP_ADMIN_PG_USERNAME SET search_path TO $HDP_PG_DB_SCHEMA_NAME;
      alter user $HDP_USER_PG_USERNAME SET search_path TO $HDP_PG_DB_SCHEMA_NAME;
    EOSQL
{{- end }}
