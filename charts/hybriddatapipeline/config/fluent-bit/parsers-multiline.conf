# ════════════════════════════════════════════════════════════════
# HDP Multiline Parsers — parsers-multiline.conf
# ════════════════════════════════════════════════════════════════
# Source of truth: otel-hdp-logs/config/fluent-bit/
#
# Fluent Bit multiline parsers join continuation lines (Java stack
# traces, Spring Boot banners, etc.) onto the preceding record.
#
# Rule syntax:  rule  "state"  "regex"  "next_state"
#   - "start_state" = first line of a new record
#   - "cont"        = continuation line (appended to current record)
#
# See DESIGN-PROPOSAL-Centralized-Logging.md Section 9.2.
# ════════════════════════════════════════════════════════════════

# ── Java Stack Trace for DAS / Notification / Tomcat ───────────
# First line starts with DD-Mon-YYYY timestamp.
# Continuation: \tat ..., Caused by:, ... N more, \t..., <blank>
[MULTILINE_PARSER]
    Name          hdp_java_stacktrace
    Type          regex
    Flush_Timeout 5000
    #
    # start_state: line begins with a timestamp like "19-Feb-2026"
    Rule  "start_state"  "/^\d{2}-\w{3}-\d{4}\s+/"  "cont"
    #
    # cont: \tat, Caused by:, Suppressed:, ... N more, or lines
    #       starting with whitespace / "at " / Exception class names
    # P1-6 FIX: original rule missed com.ddtek/com.progress/sun./jdk./io.netty/oracle.jdbc
    # vendor classes and "... N more" lines, fragmenting real HDP traces.
    Rule  "cont"         "/^(\s|Caused by:|Suppressed:|\.{3}\s+\d+\s+more|[\w$]+(\.[\w$]+)*Exception(:|$)|[\w$]+(\.[\w$]+)*Error(:|$))/"  "cont"

# ── HDPUI Stack Trace ──────────────────────────────────────────
# First line starts with DD-MM-YYYY (numeric month) timestamp.
# Continuation lines same pattern as above.
[MULTILINE_PARSER]
    Name          hdp_hdpui_stacktrace
    Type          regex
    Flush_Timeout 5000
    #
    Rule  "start_state"  "/^\d{2}-\d{2}-\d{4}\s+/"  "cont"
    # P1-6 FIX: original rule missed com.ddtek/com.progress/sun./jdk./io.netty/oracle.jdbc
    # vendor classes and "... N more" lines, fragmenting real HDP traces.
    Rule  "cont"         "/^(\s|Caused by:|Suppressed:|\.{3}\s+\d+\s+more|[\w$]+(\.[\w$]+)*Exception(:|$)|[\w$]+(\.[\w$]+)*Error(:|$))/"  "cont"

# ── catalina.out Multiline ─────────────────────────────────────
# catalina.out interleaves JULI, Spring Boot, and stdout lines.
# A new record starts with either:
#   - DD-Mon-YYYY (JULI timestamp)
#   - YYYY-MM-DDT or YYYY-MM-DD  (Spring Boot timestamp)
# Everything else (stack traces, banners, plain text) is continuation.
[MULTILINE_PARSER]
    Name          hdp_catalina_out_multiline
    Type          regex
    Flush_Timeout 5000
    #
    Rule  "start_state"  "/^(\d{2}-\w{3}-\d{4}\s+|\d{4}-\d{2}-\d{2}[T\s])/"  "cont"
    Rule  "cont"         "/^(?!(\d{2}-\w{3}-\d{4}\s+|\d{4}-\d{2}-\d{2}[T\s]))/"  "cont"

# ── Install Deploy Multiline (K8s only) ────────────────────────
# install/deploy.log interleaves:
#   - Java US-locale timestamps ("Jun 04, 2025 7:26:59 AM className")
#   - "INFO: ..." or "WARNING: ..." on the following line
#   - Shell commands (cp, mkdir) with no timestamp
#
# Strategy: A new record starts with a US-locale timestamp or a
# shell command keyword. Java log lines always come in pairs
# (timestamp + level:message), which are joined.
# Shell lines are standalone records.
[MULTILINE_PARSER]
    Name          hdp_install_deploy_multiline
    Type          regex
    Flush_Timeout 5000
    #
    # Start: US-locale timestamp OR shell command
    Rule  "start_state"  "/^([A-Z][a-z]{2}\s+\d{2},\s+\d{4}|cp\s|mkdir\s|chmod\s|chown\s|ln\s|mv\s|rm\s|cat\s|echo\s|sed\s|grep\s|tar\s|unzip\s|\/)/"  "cont"
    #
    # Continuation: level prefix (INFO: WARNING: SEVERE:) or whitespace
    Rule  "cont"         "/^(\s|INFO:|WARNING:|SEVERE:|FINE:|FINER:|FINEST:|CONFIG:)/"  "cont"
